esphome:
  name: air-conditioner
  name_add_mac_suffix: true
  project:
    name: SMLIGHT.SLWF-01Pro
    version: "2.5"

esp8266:
    board: esp12e

wifi:
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "AC-wifi"
    password: "slwf01pro"

captive_portal:

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:

# Required by the http_request update platform.
# ESP8266 has no RAM for CA certs, so SSL verification is disabled.
# tls_buffer_size_rx: 16384 is required because GitHub's TLS certificate chain
# exceeds the default 512-byte buffer, causing BR_ERR_TOO_LARGE on BearSSL.
http_request:
  verify_ssl: false
  tls_buffer_size_rx: 16384

ota:
  - platform: esphome
  - platform: http_request
    id: ota_http_request

# Auto-update check from the manifest at the repo root (see manifest_v1.1.json)
update:
  - platform: http_request
    name: Air Conditioner Firmware Update
    ota_id: ota_http_request
    source: https://raw.githubusercontent.com/smlight-tech/slwf-01pro-esphome/main/manifest_v1.1.json

uart:
  tx_pin: 1
  rx_pin: 3
  baud_rate: 9600
  
  
climate:
  - platform: midea
    name: Midea Climate         # Use a unique name.
    period: 1s                  # Optional
    timeout: 2s                 # Optional
    num_attempts: 3             # Optional
    autoconf: true              # Autoconfigure most options.
    beeper: true                # Beep on commands.
    visual:                     # Optional. Example of visual settings override.
      min_temperature: 17 °C    # min: 17
      max_temperature: 30 °C    # max: 30
      temperature_step: 0.5 °C  # min: 0.5
    supported_modes:            # All capabilities in this section detected by autoconf.
      - FAN_ONLY                # This capability is always used.
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
    custom_fan_modes:
      - SILENT
      - TURBO
    supported_presets:          # All capabilities in this section detected by autoconf.
      - ECO
      - BOOST
      - SLEEP                   # This capability is always used.
    custom_presets:             # All capabilities in this section detected by autoconf.
      - FREEZE_PROTECTION
    supported_swing_modes:
      - VERTICAL                # This capability is always used.
      - HORIZONTAL
      - BOTH
    outdoor_temperature:        # Optional. Outdoor temperature sensor (may display incorrect values after long inactivity).
      name: Temp
    power_usage:                # Optional. Power usage sensor (only for devices that support this feature).
      name: Power
    humidity_setpoint:          # Optional. Indoor humidity sensor (only for devices that support this feature).
      name: Humidity


web_server:
  port: 80